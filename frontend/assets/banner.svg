<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-radar {
        animation: pulseRadar 2.4s ease-out infinite;
        transform-origin: 1040px 140px;
      }
      .pulse-radar-delayed {
        animation: pulseRadar 2.4s ease-out 1.2s infinite;
        transform-origin: 1040px 140px;
      }
      @keyframes pulseRadar {
        0% { transform: scale(0.2); opacity: 0.9; }
        50% { opacity: 0.5; }
        100% { transform: scale(2.8); opacity: 0; }
      }

      .flow-line {
        stroke-dasharray: 12 8;
        animation: flowDash 20s linear infinite;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }

      .bus-beacon {
        animation: busHover 3s ease-in-out infinite alternate;
      }
      @keyframes busHover {
        from { transform: translateY(0px); }
        to { transform: translateY(-6px); }
      }

      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      @keyframes badgePulse {
        from { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        to { opacity: 1; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8)); }
      }

      .live-dot {
        animation: liveBlink 1.4s ease-in-out infinite;
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .grid-lines {
        opacity: 0.12;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Transit Coordinate Grid -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="0.75">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#blueGlow)" />

  <!-- Animated Vector Transit Paths in Background -->
  <path d="M 680,360 C 820,320 860,220 960,180 S 1120,100 1200,80" fill="none" stroke="#2563eb" stroke-width="2.5" class="flow-line" opacity="0.4" />
  <path d="M 740,420 C 840,300 940,240 1040,140 S 1140,60 1200,40" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" opacity="0.6" />
  <path d="M 620,420 C 720,380 840,260 1040,140" fill="none" stroke="#fbbf24" stroke-width="1.8" class="flow-line" opacity="0.35" />

  <!-- Right Visual: Radar Geolocation Beacon -->
  <g id="radar-group">
    <!-- Pulse Rings -->
    <circle cx="1040" cy="140" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-radar" />
    <circle cx="1040" cy="140" r="40" fill="none" stroke="#34d399" stroke-width="1.5" class="pulse-radar-delayed" />
    <circle cx="1040" cy="140" r="50" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" />
    <circle cx="1040" cy="140" r="16" fill="url(#blueGlow)" filter="url(#glowFilter)" />
    
    <!-- Radar Target Nodes -->
    <g class="bus-beacon">
      <!-- Outer Ring Road Hub marker -->
      <rect x="980" y="210" width="120" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="994" cy="226" r="4" fill="#34d399" class="live-dot" />
      <text x="1006" y="231" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">500-D (ORR)</text>
      <text x="1070" y="231" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1m</text>

      <!-- Silk Board Hub marker -->
      <rect x="850" y="100" width="128" height="32" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <circle cx="864" cy="116" r="4" fill="#fbbf24" />
      <text x="876" y="121" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Silk Board Split</text>
    </g>
  </g>

  <!-- Left Main Content Area -->
  <g transform="translate(80, 0)">
    <!-- Live Status Chip -->
    <g transform="translate(0, 60)" class="badge-glow">
      <rect width="260" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="15" r="5" fill="#34d399" class="live-dot" />
      <text x="32" y="19.5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BMTC VTMS TELEMETRY ACTIVE</text>
    </g>

    <!-- Main App Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Namma<tspan fill="#38bdf8">BMTC</tspan> Navigator
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Destination-aware bus boarding point recommender &amp; real-time transit telemetry
    </text>
    <text x="0" y="210" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Engineered for complex multi-platform junctions, highway splits &amp; peri-urban radials in Bengaluru.
    </text>

    <!-- Feature Metric Cards (Bottom) -->
    <g transform="translate(0, 260)">
      <!-- Card 1 -->
      <g>
        <rect width="145" height="74" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="16" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">9,960</text>
        <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Stops Indexed</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(160, 0)">
        <rect width="145" height="74" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="16" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">4,434</text>
        <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Routes Mapped</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(320, 0)">
        <rect width="145" height="74" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="16" y="32" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">&lt; 35ms</text>
        <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">FastAPI Graph</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(480, 0)">
        <rect width="175" height="74" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="16" y="32" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">100% Free</text>
        <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Render Zero-Cost Host</text>
      </g>
    </g>
  </g>
</svg>
