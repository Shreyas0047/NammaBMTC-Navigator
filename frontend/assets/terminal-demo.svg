<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <style>
      .beacon-ring {
        animation: ringExpand 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: 52px 146px;
      }
      @keyframes ringExpand {
        0% { transform: scale(0.3); opacity: 0.9; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      .live-pulse {
        animation: pulseFade 1.5s ease-in-out infinite alternate;
      }
      @keyframes pulseFade {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }
      .eta-badge {
        animation: etaGlow 2.5s ease-in-out infinite alternate;
      }
      @keyframes etaGlow {
        from { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.3)); }
        to { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8)); }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="420" rx="14" fill="#0b0f19" />
  
  <!-- Window Title Bar -->
  <rect width="800" height="42" rx="14" fill="#1e293b" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">NammaBMTC Transit Recommendation Engine — Live Telemetry</text>

  <!-- Stepper Card -->
  <g transform="translate(30, 64)">
    <!-- Journey Stepper Line -->
    <line x1="22" y1="36" x2="22" y2="82" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="22" y1="130" x2="22" y2="230" stroke="#3b82f6" stroke-width="2.5" />

    <!-- Step 1: Origin -->
    <circle cx="22" cy="24" r="8" fill="#3b82f6" />
    <circle cx="22" cy="24" r="3" fill="#ffffff" />
    <text x="44" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CURRENT BOARDING ORIGIN</text>
    <text x="44" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Central Silk Board Junction (Hub)</text>

    <!-- Walk Directive Pill -->
    <rect x="44" y="52" width="160" height="24" rx="12" fill="#334155" />
    <text x="56" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🚶 Walk 120 m (~2 min)</text>

    <!-- Step 2: Primary Boarding Stop Card -->
    <g transform="translate(0, 96)">
      <!-- Animated Radar Beacon -->
      <circle cx="22" cy="50" r="18" fill="none" stroke="#10b981" stroke-width="1.5" class="beacon-ring" />
      <circle cx="22" cy="50" r="9" fill="#10b981" />
      <circle cx="22" cy="50" r="4" fill="#ffffff" />

      <!-- Card Base -->
      <rect x="44" y="0" width="690" height="152" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
      
      <!-- Recommended Badge -->
      <rect x="60" y="16" width="112" height="22" rx="6" fill="#1e3a8a" />
      <text x="70" y="31" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">★ OPTIMAL BOARD</text>

      <!-- Stop Name & Direction -->
      <text x="60" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">Central Silk Board (Towards Marathahalli)</text>
      <text x="60" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Outer Ring Road Service Road · Avoids Electronic City split</text>

      <!-- Route Pills with Live VTMS telemetry -->
      <g transform="translate(60, 98)">
        <!-- Route 500-D -->
        <rect width="110" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">500-D</text>
        <text x="64" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">84 trips</text>

        <!-- Route V-500F -->
        <rect x="120" width="110" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="132" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">V-500F</text>
        <text x="184" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">42 trips</text>

        <!-- Live Bus Status Chip -->
        <g transform="translate(240, 0)" class="eta-badge">
          <rect width="250" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
          <circle cx="16" cy="17" r="4" fill="#34d399" class="live-pulse" />
          <text x="28" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">LIVE VTMS: 31 BUSES ACTIVE</text>
          <text x="188" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">ETA 1m</text>
        </g>
      </g>
    </g>

    <!-- Step 3: Destination -->
    <g transform="translate(0, 270)">
      <circle cx="22" cy="18" r="8" fill="#ef4444" />
      <circle cx="22" cy="18" r="3" fill="#ffffff" />
      <text x="44" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TARGET DESTINATION</text>
      <text x="44" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Marathahalli Bridge (Direct Reachability Confirmed)</text>
    </g>
  </g>
</svg>
