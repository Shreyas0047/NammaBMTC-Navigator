services:
  - type: web
    name: namma-bmtc-navigator
    env: python
    plan: free
    region: singapore # Closest free region to India (Bengaluru)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
